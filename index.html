header{

}

.logo{

}

.pesquisa{

color:white;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:25px;
padding:40px;
}

.card{
background:rgba(26,0,51,0.8);
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
margin:10px;
}

.card p{
margin:10px;
color:#ccc;
}

.jogo{
display:none;
padding:40px;
max-width:1200px;
margin:auto;
}

#nomeJogo{
text-align:center;
margin-top:25px;
font-size:34px;
font-weight:600;
}

#notaJogo{
text-align:center;
color:#ffd700;
font-size:18px;
margin-top:6px;
}
  
.banner{
width:100%;
height:520px;
object-fit:cover;
border-radius:12px;
box-shadow:0 0 40px #7b00ff;
}

.caixa{
background:rgba(26,0,51,0.8);
padding:20px;
border-radius:10px;
margin-top:20px;
}

.voltarTopo{
position:fixed;
top:20px;
left:20px;
width:50px;
height:50px;
border-radius:50%;
background:#7b00ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer;
box-shadow:0 0 15px #7b00ff;
z-index:999;
}

.trailer{
width:100%;
height:500px;
border:none;
border-radius:10px;
}

.galeria{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.galeria img{
width:100%;
border-radius:10px;
}

footer{
text-align:center;
padding:30px;
}

.player{
display:flex;
align-items:center;
gap:15px;
background:rgba(26,0,51,0.9);
padding:12px;
border-radius:12px;
margin-top:20px;
}

.capaMusica{
width:60px;
height:60px;
border-radius:8px;
object-fit:cover;
}

.playerInfo{
flex:1;
}

#nomeMusica{
font-size:14px;
margin-bottom:5px;
}

.barraMusica{
width:100%;
height:6px;
background:#444;
border-radius:10px;
overflow:hidden;
cursor:pointer;
position:relative;
}

#progressoMusica{
height:100%;
width:0%;
background:#7b00ff;
}

.bolinha{
width:14px;
height:14px;
background:#7b00ff;
border-radius:50%;
position:absolute;
top:-4px;
left:0%;
transform:translateX(-50%);
}
  
.botaoMusica{
background:#7b00ff;
border:none;
color:white;
font-size:18px;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

</style>

let lista=document.getElementById("listaJogos")

jogos.forEach(j=>{

let card=document.createElement("div")
card.className="card"

card.innerHTML=`
<img src="${j.capa}">
<h3>${j.nome}</h3>
<p>${j.nota}</p>
`

card.onclick=()=>abrir(j)

lista.appendChild(card)

})

function abrir(j){

window.scrollTo(0,0)
  
document.querySelector(".grid").style.display="none"
paginaJogo.style.display="block"
barraPesquisa.style.display="none"

imgJogo.src=j.banner
nomeJogo.innerText=j.nome
notaJogo.innerText=j.nota
descJogo.innerText=j.desc
trailerJogo.src=j.trailer

if(j.musica){

document.querySelector(".player").style.display="flex"

musicaJogo.src=j.musica
musicaJogo.play()

capaMusica.src=j.musicaCapa
nomeMusica.innerText=j.musicaNome

}else{

document.querySelector(".player").style.display="none"

musicaJogo.pause()
musicaJogo.src=""

capaMusica.src=""
nomeMusica.innerText=""

}
infoJogo.innerHTML=""
galeriaJogo.innerHTML=""
semelhantes.innerHTML=""

j.info.forEach(d=>infoJogo.innerHTML+=`<li>${d}</li>`)


j.galeria.forEach(img=>{
galeriaJogo.innerHTML+=`<img src="${img}">`
})

j.semelhantes.forEach(nome=>{

let jogo=jogos.find(x=>x.nome===nome)

if(jogo){

let card=document.createElement("div")
card.className="card"

card.innerHTML=`
<img src="${jogo.capa}">
<h3>${jogo.nome}</h3>
<p>${jogo.nota}</p>
`

card.onclick=()=>abrir(jogo)

semelhantes.appendChild(card)

}

})

}

function voltar(){
document.querySelector(".grid").style.display="grid"
paginaJogo.style.display="none"
barraPesquisa.style.display="block"
musicaJogo.pause()
musicaJogo.currentTime=0
}

function buscar(texto){

texto=texto.toLowerCase()

document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(texto)?"block":"none"
})

}

let musica=document.getElementById("musicaJogo")

function toggleMusica(){

if(musica.paused){
musica.play()
}else{
musica.pause()
}

}

musica.ontimeupdate=function(){

let porcentagem=(musica.currentTime/musica.duration)*100

progressoMusica.style.width=porcentagem+"%"
bolinha.style.left=porcentagem+"%"

}

function mudarTempo(e){

let barra=e.currentTarget
let largura=barra.clientWidth
let clique=e.offsetX

let porcentagem=clique/largura

musica.currentTime=porcentagem*musica.duration

}
  
</script>
